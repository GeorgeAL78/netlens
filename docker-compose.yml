# NetLens — example compose file. `docker compose up -d`, then open
# http://<this-host>:3780 and finish the short setup in the browser.
services:
  netlens:
    image: gjergjk/netlens:latest
    container_name: netlens
    restart: unless-stopped
    ports:
      - "3780:3780"
      # UniFi SIEM syslog for ad-block counts (listener on by default; point UniFi's SIEM server here).
      - "5514:5514/tcp"
      - "5514:5514/udp"
    environment:
      TZ: America/New_York             # optional; also changeable in the app's Settings
    # Console address, API key and login password are set in the web UI on first start.
    volumes:
      - ./data:/data
