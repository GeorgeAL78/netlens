name: Build and publish

# A tag v1.2.3 publishes :latest and :1.2.3; a tag containing "beta" publishes only :beta
# and a GitHub pre-release, so a beta never reaches users who track :latest (the Unraid
# template does). Same scheme as pia-qbittorrent-docker.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/georgeal78/unifi-netlens
  HUB_IMAGE: gjergjk/unifi-netlens

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: github.repository == 'GeorgeAL78/unifi-netlens'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests and release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      packages: write
    env:
      # Docker Hub is optional: without the secrets the release still ships to GHCR.
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Image names
        id: names
        run: |
          {
            echo "list<<EOF"
            echo "${GHCR_IMAGE}"
            if [ -n "${DOCKER_USERNAME}" ]; then echo "${HUB_IMAGE}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.list }}
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref_name, 'beta') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, 'beta') }}
            type=semver,pattern={{version}},enable=${{ !contains(github.ref_name, 'beta') }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${GHCR_IMAGE}:${{ steps.meta.outputs.version }}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          make_latest: ${{ contains(github.ref_name, 'beta') && 'false' || 'true' }}
